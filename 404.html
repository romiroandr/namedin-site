<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Страница не найдена — Namedin</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M12 2 2 21h20L12 2z' fill='%23ff7a1a'/%3E%3C/svg%3E">
<style>
:root{--bg:#0a0a0c;--s2:#141418;--line:rgba(255,255,255,.1);--text:#d7d7de;--silver:#ededf0;--muted:#9d9da8;--accent:#ff7a1a;--accent-h:#ff9447;
  --font:Inter,"SF Pro Text","Helvetica Neue",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);line-height:1.6;-webkit-font-smoothing:antialiased}
main{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 16px}
.card{max-width:560px;width:100%;border:1px solid var(--line);border-radius:16px;padding:32px;
  background:linear-gradient(180deg,rgba(255,255,255,.04),transparent 40%),var(--s2)}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.eyebrow i{font-style:normal;color:var(--accent)}
h1{color:var(--silver);font-size:32px;line-height:1.1;letter-spacing:-.03em;margin:0 0 12px}
p{margin:0 0 20px;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:10px}
a.btn{display:inline-flex;align-items:center;min-height:44px;padding:0 18px;border-radius:12px;text-decoration:none;font-weight:550;
  border:1px solid rgba(255,255,255,.16);color:var(--silver);background:rgba(255,255,255,.05)}
a.btn.primary{background:var(--accent);border-color:var(--accent);color:#1a0c02}
a.btn:hover{border-color:var(--accent-h)}
a.btn:focus-visible{outline:2px solid var(--accent-h);outline-offset:2px}
</style>
</head><body><main>
<div class="card">
  <p class="eyebrow"><i>●</i> Ошибка 404</p>
  <h1>Такой страницы нет</h1>
  <p>Возможно, ссылка устарела или в адресе опечатка. Вот куда можно перейти:</p>
  <div class="row">
    <a class="btn primary" href="/#request">Бесплатный замер</a>
    <a class="btn" href="/">На главную</a>
    <a class="btn" href="https://t.me/mirrnr">Написать в телеграм</a>
  </div>
</div>
</main></body></html>
